<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
</head>
<body>
    <header>
        <div class="header_container">
        <div class="header_div">
            <div class="header_logo">
                <img src="./images/header_logo.png" alt="logo">
            </div><!--header_logo-->
            <h3 class="header_text">FURNIRO</h3><!--header_text-->
        </div> <!--header_div-->
        <div class="header_ul">
            <ul class="header_ul">
                <li class="header_li">Home</li>
                <li class="header_li">Shop</li>
                <li class="header_li">About</li>
                <li class="header_li">Contact</li>
            </ul>
        </div><!--header_ul-->
        <div class="header_icon">
            <span><img src="./images/header_contact.png" alt="contact" class="icons"></span>
            <span><img src="./images/header_heart.png" alt="heart" class="icons"></span>
            <span><img src="./images/header_search.png" alt="search" class="icons"></span>
            <span><img src="./images/header_cart.png" alt="cart" class="icons"></span>
        </div><!--headericon-->
        </div><!--header_container-->
    </header>
    <div class="hero_container">
        <div class="hero_image">
            <img src="./images/hero_image.png" alt="hero_image" class="hero_img">
        </div>
        <div class="hero_container2">
            <div class="hero_text">
            <h6 class="hero_h6">New Arrival</h6>
            <h1 class="hero_h1">Discover Our New Collection</h1>
            <h3 class="hero_h3">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut elit tellus, luctus nec ullamcorper mattis.</h3>
            <button class="hero_button">Buy Now</button>
        </div><!--hero_text-->
        </div><!--hero_container2-->
    </div>
    <div class="hero_text2">
    <h2 class="hero_h2">Browse The Range</h2>
    <p class="hero_p">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    </div><!--hero_text2-->
    <div class="card_container">
        <div class="cards">
            <img src="./images/Mask Group.png" alt=""class="card">
            <div class="img_text">Dining</div>
        </div>
        <div class="cards">
            <img src="./images/Image-living room.png" alt="" class="card">
            <div class="img_text">Living</div>
        </div>
        <div class="cards">
            <img src="./images/Image-living room.png" alt="" class="card">
            <div class="img_text">Bedroom</div>
        </div>
    </div>
</body>
</html>
